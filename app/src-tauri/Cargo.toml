[workspace]
# Standalone workspace: the repo root's Cargo.toml owns canvas-core and
# canvasd only. This crate is built separately (`admin build` / `admin
# deploy`), so it never shares the root's Cargo.lock resolution.

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
canvas-core = { path = "../../canvas-core" }
tauri-plugin-deep-link = "2"
