<!doctype html>
<!-- Served by Canvas.app's canvas:// scheme handler (src/bridge.rs) with a 503
     whenever canvasd's socket doesn't answer: not started yet at login, or
     mid-restart during `admin deploy`. WKWebView never retries a failed first
     navigation, so this page reloads itself until canvasd is back. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="1" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #f4f3ef;
        color: #888;
        font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>Waiting for canvasd&hellip;</body>
</html>
