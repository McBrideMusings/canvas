<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Canvas</title>
  <link rel="stylesheet" href="theme.css" />
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="disconnected-banner" class="banner" hidden>Reconnecting to canvasd…</div>
  <div class="titlebar" id="titlebar" data-tauri-drag-region>
    <div class="titlebar-spacer"></div>
    <button
      type="button"
      id="pin-toggle"
      class="icon-btn titlebar-btn"
      aria-pressed="false"
      aria-label="Pin window on top"
      hidden
    ></button>
    <button
      type="button"
      id="theme-toggle"
      class="icon-btn titlebar-btn"
      aria-label="Switch to dark mode"
    ></button>
    <button
      type="button"
      id="drawer-toggle"
      class="icon-btn titlebar-btn"
      aria-controls="drawer"
      aria-expanded="false"
      aria-label="Sessions"
    ></button>
    <button
      type="button"
      id="settings-toggle"
      class="icon-btn titlebar-btn"
      aria-label="Settings"
    ></button>
  </div>
  <div class="toolbar" id="toolbar">
    <div class="search" id="search">
      <label class="search-field">
        <span class="search-icon" id="search-icon"></span>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search posts & sessions"
          aria-label="Search posts, sessions, repos"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
        <kbd class="search-hint" id="search-hint">/</kbd>
        <button
          type="button"
          id="search-clear"
          class="search-clear"
          aria-label="Clear search"
          hidden
        ></button>
      </label>
      <span class="search-count" id="search-count" hidden></span>
    </div>
    <nav id="chips" class="chips" role="toolbar" aria-label="Filter by session"></nav>
  </div>
  <div class="body-split">
    <div class="main-col">
      <div class="pill-anchor"><button type="button" id="new-pill" class="new-pill" hidden></button></div>
      <main class="stream" id="stream" data-filter-session="">
        <div class="empty-state" id="empty-state">
          No posts yet. Canvas shows what your Claude sessions post as they work.
        </div>
        <div id="cards"></div>
      </main>
      <button type="button" id="to-top" class="to-top" aria-label="Back to top" hidden></button>
    </div>
    <aside id="drawer" class="drawer" aria-label="Sessions" inert>
      <div class="drawer-header">
        <h2 class="drawer-title">Sessions</h2>
      </div>
      <div id="drawer-body" class="drawer-body"></div>
    </aside>
  </div>
  <div
    id="image-overlay"
    class="image-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Image viewer"
    tabindex="-1"
    hidden
  >
    <img id="image-overlay-img" src="" alt="" />
    <button
      type="button"
      id="image-overlay-prev"
      class="image-overlay-nav image-overlay-prev"
      aria-label="Previous image"
      hidden
    ></button>
    <button
      type="button"
      id="image-overlay-next"
      class="image-overlay-nav image-overlay-next"
      aria-label="Next image"
      hidden
    ></button>
    <div id="image-overlay-count" class="image-overlay-count" hidden></div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
