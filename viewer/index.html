<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canvas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="disconnected-banner" class="banner" hidden>Reconnecting to canvasd…</div>
  <div class="titlebar" id="titlebar" data-tauri-drag-region>
    <button
      type="button"
      id="sidebar-toggle"
      class="icon-btn titlebar-btn"
      aria-expanded="true"
      aria-label="Hide sessions"
    ></button>
    <div class="titlebar-spacer"></div>
    <button
      type="button"
      id="pin-toggle"
      class="icon-btn titlebar-btn"
      aria-pressed="false"
      aria-label="Pin window on top"
      hidden
    ></button>
  </div>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="stream" id="stream">
      <div class="empty-state" id="empty-state">
        No posts yet. Canvas shows what your Claude sessions post as they work.
      </div>
      <div id="cards"></div>
    </main>
  </div>
  <div
    id="image-overlay"
    class="image-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Image viewer"
    tabindex="-1"
    hidden
  >
    <img id="image-overlay-img" src="" alt="" />
    <button
      type="button"
      id="image-overlay-prev"
      class="image-overlay-nav image-overlay-prev"
      aria-label="Previous image"
      hidden
    ></button>
    <button
      type="button"
      id="image-overlay-next"
      class="image-overlay-nav image-overlay-next"
      aria-label="Next image"
      hidden
    ></button>
    <div id="image-overlay-count" class="image-overlay-count" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
