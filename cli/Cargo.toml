[package]
name = "canvas"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "canvas"
path = "src/main.rs"

[dependencies]
canvas-core = { path = "../canvas-core" }
canvasd = { path = "../canvasd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
pulldown-cmark = "0.13.4"
